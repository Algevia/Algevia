
name: Algevia Maths Verification

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of questions to verify"
        required: true
        default: "10"
        type: choice
        options:
          - "10"
          - "50"
          - "100"
          - "250"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r verification/requirements.txt

      - name: Run independent verification
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          mkdir -p verification/results
          python verification/run.py

      - name: Save verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algevia-verification-results
          path: verification/results/
          if-no-files-found: warn
          retention-days: 30
